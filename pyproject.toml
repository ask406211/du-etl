[project]
name = "ducks-unlimited"
version = "0.1.0"
description = "ETL pipeline for Ducks Unlimited university chapters"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
ducks-unlimited = "ducks_unlimited.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live Postgres"]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.package-data]
ducks_unlimited = ["sql/*.sql"]
