name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest

    # A throwaway Postgres so the integration tests run on every PR.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: du
          POSTGRES_PASSWORD: du_ci_only
          POSTGRES_DB: du
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U du -d du"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src

      - name: Unit tests
        run: pytest -q

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgresql://du:du_ci_only@localhost:5432/du
        run: pytest -m integration -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Validate
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
